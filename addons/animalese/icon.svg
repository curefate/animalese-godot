<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Animal Crossing Mint / Emerald) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42d89e"/>
      <stop offset="100%" stop-color="#1f9466"/>
    </linearGradient>

    <!-- Waveform Gradient (Warm Playful Coral / Tangerine) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b4d"/>
      <stop offset="100%" stop-color="#f55330"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#bgGrad)" stroke="#17734f" stroke-width="2"/>

  <!-- Grounding Shadow at bottom -->
  <ellipse cx="64" cy="112" rx="34" ry="4.5" fill="#145d40" opacity="0.3"/>

  <!-- Vector Drop Shadow for cross-platform / ThorVG compatibility -->
  <g fill="#176344" opacity="0.32" transform="translate(0, 3.5)">
    <circle cx="36" cy="40" r="15"/>
    <circle cx="92" cy="40" r="15"/>
    <path d="M 34 86 C 30 96 24 101 19 103 C 27 101 37 96 44 91 Z"/>
    <rect x="20" y="42" width="88" height="54" rx="27"/>
  </g>

  <!-- Main Animal Speech Bubble -->
  <!-- Left Ear -->
  <circle cx="36" cy="40" r="15" fill="#ffffff"/>
  <circle cx="36" cy="40" r="8.5" fill="#fca8b6"/>

  <!-- Right Ear -->
  <circle cx="92" cy="40" r="15" fill="#ffffff"/>
  <circle cx="92" cy="40" r="8.5" fill="#fca8b6"/>

  <!-- Speech Tail -->
  <path d="M 34 86 C 30 96 24 101 19 103 C 27 101 37 96 44 91 Z" fill="#ffffff"/>

  <!-- Main Bubble Pill -->
  <rect x="20" y="42" width="88" height="54" rx="27" fill="#ffffff"/>

  <!-- Cute Blush Cheeks -->
  <ellipse cx="31" cy="71" rx="4.5" ry="2.6" fill="#fca8b6" opacity="0.85"/>
  <ellipse cx="97" cy="71" rx="4.5" ry="2.6" fill="#fca8b6" opacity="0.85"/>

  <!-- Procedural Voice Sound Wave Bars (Pitch & Formant Visualizer) -->
  <rect x="40" y="62" width="5.5" height="16" rx="2.75" fill="url(#waveGrad)"/>
  <rect x="51" y="54" width="5.5" height="32" rx="2.75" fill="url(#waveGrad)"/>
  <rect x="62" y="48" width="5.5" height="44" rx="2.75" fill="url(#waveGrad)"/>
  <rect x="73" y="56" width="5.5" height="28" rx="2.75" fill="url(#waveGrad)"/>
  <rect x="84" y="63" width="5.5" height="14" rx="2.75" fill="url(#waveGrad)"/>

  <!-- Playful Floating Music Note & Sparkle -->
  <g transform="translate(101, 18)">
    <path d="M 3 13 C 1.5 13 0 11.8 0 10 C 0 8.5 1.5 7.2 3.2 7.2 C 4.5 7.2 5.5 8 5.8 9 L 6 9 L 6 2 L 12 0.5 L 12 4 L 7.5 5.2 L 7.5 10.5" fill="#145d40" opacity="0.25" transform="translate(0, 1)"/>
    <ellipse cx="3" cy="11.5" rx="3.2" ry="2.3" fill="#ffe066" transform="rotate(-15 3 11.5)"/>
    <rect x="5" y="3.5" width="2" height="8" rx="1" fill="#ffe066"/>
    <path d="M 5 3.5 L 12 1.5 L 12 4.2 L 5 6.2 Z" fill="#ffe066"/>
    <ellipse cx="2.5" cy="11" rx="1.5" ry="1" fill="#fff9db" transform="rotate(-15 2.5 11)"/>
    <path d="M 16 0 Q 16 4.5 20.5 4.5 Q 16 4.5 16 9 Q 16 4.5 11.5 4.5 Q 16 4.5 16 0 Z" fill="#fff385"/>
  </g>
</svg>
